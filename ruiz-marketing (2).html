<style>
:root {
  --black: #0a0a0a;
  --gold: #C9A84C;
  --gold-light: #F5D98B;
  --white: #ffffff;
  --gray: #f5f5f5;
  --gray-mid: #888;
  --gold-trans: rgba(201,168,76,0.12);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Montserrat',sans-serif;background:var(--white);color:var(--black);overflow-x:hidden;}

/* SCROLLBAR */
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:#0a0a0a;}
::-webkit-scrollbar-thumb{background:var(--gold);border-radius:2px;}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:1000;padding:16px 40px;display:flex;align-items:center;justify-content:space-between;transition:all 0.4s ease;background:var(--black);}
nav.scrolled{background:rgba(10,10,10,0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:0.5px solid rgba(201,168,76,0.2);padding:12px 40px;}
.nav-brand{display:flex;align-items:center;gap:12px;text-decoration:none;}
.nav-avatar{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--gold);object-fit:cover;object-position:50% 15%;}
.nav-logo{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;color:var(--gold);letter-spacing:1px;text-decoration:none;}
.nav-links{display:flex;gap:32px;list-style:none;}
.nav-links a{color:rgba(255,255,255,0.75);text-decoration:none;font-size:12px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;transition:color 0.3s;}
.nav-links a:hover{color:var(--gold);}
.nav-cta{background:var(--gold);color:var(--black);padding:8px 20px;border-radius:2px;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;text-decoration:none;transition:all 0.3s;}
.nav-cta:hover{background:var(--gold-light);}
.nav-toggle{display:none;background:none;border:none;cursor:pointer;color:var(--white);font-size:20px;}
.mobile-menu{display:none;position:fixed;inset:0;background:var(--black);z-index:999;flex-direction:column;align-items:center;justify-content:center;gap:32px;}
.mobile-menu.open{display:flex;}
.mobile-menu a{color:var(--white);text-decoration:none;font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:600;transition:color 0.3s;}
.mobile-menu a:hover{color:var(--gold);}
.mobile-close{position:absolute;top:24px;right:32px;background:none;border:none;color:var(--white);font-size:24px;cursor:pointer;}

/* HERO */
#hero{min-height:100vh;background:var(--black);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:100px 40px 60px;}
#particles-canvas{position:absolute;inset:0;pointer-events:none;}
.hero-inner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;gap:0;}
.hero-photo-wrap{width:140px;height:140px;border-radius:50%;border:2px solid var(--gold);padding:4px;margin-bottom:28px;position:relative;}
.hero-photo-wrap::before{content:'';position:absolute;inset:-6px;border-radius:50%;border:1px solid rgba(201,168,76,0.25);animation:pulse-ring 2.5s ease-out infinite;}
.hero-photo{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 15%;display:block;}
.hero-tag{font-size:10px;font-weight:600;letter-spacing:4px;text-transform:uppercase;color:var(--gold);opacity:0.8;margin-bottom:16px;}
.hero-name{font-family:'Cormorant Garamond',serif;font-size:clamp(48px,8vw,88px);font-weight:700;color:var(--white);line-height:0.95;margin-bottom:20px;}
.hero-name span{background:linear-gradient(135deg,#F5D98B,#C9A84C);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.hero-subtitle{font-size:12px;font-weight:400;color:rgba(255,255,255,0.6);letter-spacing:2px;text-transform:uppercase;margin-bottom:24px;line-height:1.8;}
.hero-fe{font-family:'Cormorant Garamond',serif;font-size:20px;font-style:italic;color:rgba(245,217,139,0.9);margin-bottom:36px;max-width:520px;line-height:1.6;}
.hero-btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;}
.btn-primary{background:var(--gold);color:var(--black);padding:14px 32px;border-radius:2px;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;text-decoration:none;transition:all 0.3s;display:flex;align-items:center;gap:8px;}
.btn-primary:hover{background:var(--gold-light);transform:translateY(-2px);}
.btn-secondary{border:1px solid rgba(201,168,76,0.5);color:var(--gold);padding:14px 32px;border-radius:2px;font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;text-decoration:none;transition:all 0.3s;}
.btn-secondary:hover{border-color:var(--gold);background:rgba(201,168,76,0.08);}

/* SOBRE MÍ */
#sobre{padding:100px 40px;background:var(--white);}
.container{max-width:1100px;margin:0 auto;}
.section-tag{font-size:10px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:var(--gold);margin-bottom:12px;}
.section-title{font-family:'Cormorant Garamond',serif;font-size:clamp(36px,5vw,56px);font-weight:700;color:var(--black);line-height:1.05;margin-bottom:40px;}
.sobre-grid{display:grid;grid-template-columns:1fr 1.4fr;gap:60px;align-items:center;}
.sobre-photo-wrap{position:relative;border-radius:4px;overflow:hidden;height:400px;border:1px solid #e0e0e0;}
.sobre-photo{width:100%;height:100%;object-fit:cover;object-position:50% 15%;display:block;}
.sobre-text{display:flex;flex-direction:column;gap:20px;}
.sobre-p{font-size:15px;color:#444;line-height:1.85;font-weight:300;}
.sobre-p strong{color:var(--black);font-weight:600;}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--gray);border:0.5px solid #e0e0e0;border-radius:99px;padding:7px 14px;font-size:11px;font-weight:500;color:#444;transition:all 0.3s;}
.badge:hover{background:var(--gold-trans);border-color:var(--gold);color:var(--black);}

/* SERVICIOS */
#servicios{padding:100px 40px;background:var(--black);}
#servicios .section-tag{color:var(--gold);}
#servicios .section-title{color:var(--white);}
.servicios-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.service-card{background:#111;padding:32px 24px;border:1px solid rgba(255,255,255,0.08);border-radius:4px;display:flex;flex-direction:column;gap:16px;transition:all 0.3s;position:relative;overflow:hidden;}
.service-card:hover{border-color:var(--gold);background:#161616;transform:translateY(-3px);}
.service-badge{display:inline-block;background:rgba(201,168,76,0.15);color:var(--gold);font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:4px 8px;border-radius:2px;align-self:flex-start;}
.service-icon-wrap{width:44px;height:44px;border:1px solid rgba(201,168,76,0.3);border-radius:2px;display:flex;align-items:center;justify-content:center;}
.service-icon-wrap i{color:var(--gold);font-size:18px;}
.service-name{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;color:var(--white);}
.service-desc{font-size:12px;color:rgba(255,255,255,0.6);line-height:1.75;font-weight:300;flex:1;}

/* POR QUÉ */
#porque{padding:100px 40px;background:var(--black);border-top:0.5px solid rgba(255,255,255,0.06);}
#porque .section-title{color:var(--white);}
.porque-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;margin-top:16px;}
.porque-card{text-align:center;padding:40px 28px;border:0.5px solid rgba(201,168,76,0.15);border-radius:2px;transition:all 0.3s;position:relative;}
.porque-card:hover{border-color:var(--gold);background:rgba(201,168,76,0.04);}
.porque-icon{font-size:36px;color:var(--gold);margin-bottom:20px;display:block;}
.porque-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;color:var(--white);margin-bottom:12px;line-height:1.2;}
.porque-text{font-size:13px;color:rgba(255,255,255,0.5);line-height:1.75;font-weight:300;}

/* PORTAFOLIO */
#portafolio{padding:100px 40px;background:var(--gray);}
.portfolio-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px;}
.portfolio-item{aspect-ratio:1/1;position:relative;overflow:hidden;border-radius:2px;cursor:pointer;}
.portfolio-item img{width:100%;height:100%;object-fit:cover;transition:transform 0.5s ease;}
.portfolio-item:hover img{transform:scale(1.06);}
.portfolio-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(10,10,10,0.85),transparent);opacity:0;transition:opacity 0.3s;display:flex;flex-direction:column;justify-content:flex-end;padding:20px;}
.portfolio-item:hover .portfolio-overlay{opacity:1;}
.portfolio-label{font-size:12px;font-weight:600;color:var(--white);letter-spacing:1px;}
.portfolio-sub{font-size:11px;color:var(--gold);margin-top:3px;}

/* SECCIÓN FE / DIOS */
#fe{padding:120px 40px;background:var(--black);text-align:center;position:relative;overflow:hidden;}
#fe::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:600px;height:600px;border-radius:50%;border:1px solid rgba(201,168,76,0.06);pointer-events:none;}
#fe::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:400px;height:400px;border-radius:50%;
